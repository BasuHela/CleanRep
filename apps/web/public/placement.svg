<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Figtree, Roboto, Helvetica, Arial, sans-serif">
  <title>Phone placement, top view</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eef2ee"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#1b2d28"/>
  <text x="450" y="52" text-anchor="middle" font-size="34" font-weight="600" fill="#eef2ee">Top view</text>
  <!-- TV -->
  <rect x="560" y="80" width="220" height="22" rx="3" fill="#eef2ee"/>
  <text x="670" y="140" text-anchor="middle" font-size="30" fill="#a3b5ad">TV</text>
  <!-- person -->
  <ellipse cx="670" cy="300" rx="58" ry="24" fill="#c8f27a" stroke="#10201b" stroke-width="4"/>
  <circle cx="670" cy="300" r="18" fill="#1b2d28" stroke="#10201b" stroke-width="4"/>
  <line x1="670" y1="272" x2="670" y2="170" stroke="#eef2ee" stroke-width="4" marker-end="url(#b)"/>
  <text x="670" y="368" text-anchor="middle" font-size="30" fill="#eef2ee">You</text>
  <!-- phone -->
  <rect x="96" y="274" width="26" height="52" rx="4" fill="#eef2ee"/>
  <text x="109" y="254" text-anchor="middle" font-size="30" fill="#eef2ee">Phone</text>
  <path d="M122,300 L600,190 L600,410 Z" fill="#c8f27a" fill-opacity="0.18" stroke="#c8f27a" stroke-dasharray="8 6" stroke-width="2"/>
  <!-- distance -->
  <line x1="122" y1="455" x2="670" y2="455" stroke="#a3b5ad" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="396" y="500" text-anchor="middle" font-size="30" fill="#a3b5ad">2.5–3 m, side-on, at hip height</text>
</svg>
